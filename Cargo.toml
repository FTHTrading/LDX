[package]
name = "ldx"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["FTHTrading / LD Capital <kevan@ldrcllc.com>"]
license = "Proprietary"
description = "LDX — Lamport Digital Exchange. Post-quantum sovereign liquidity & RWA clearing mesh for institutional private credit."
repository = "https://github.com/FTHTrading/LDX"
readme = "README.md"
keywords = ["post-quantum", "lamport", "rwa", "clearing", "institutional"]
categories = ["cryptography", "finance"]

[dependencies]
sha2       = "0.10"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Kept lean; add criterion/proptest as needed under LD Capital review
serde_json = "1.0"

[[bin]]
name = "ldx"
path = "src/main.rs"

[lib]
name = "ldx"
path = "src/lib.rs"

[profile.release]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
strip            = true
panic            = "abort"
debug            = false
overflow-checks  = false

[profile.dev]
opt-level        = 0
debug            = true
overflow-checks  = true
