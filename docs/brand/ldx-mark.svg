<?xml version="1.0" encoding="UTF-8"?>
<!--
  LDX / LD Capital interlocking-triangle mark.
  Working recreation from published logo — replace with official vector when Niraj approves.
  Palette: Navy 900 #122A4E · Sky 400 #7FB2DE
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" role="img" aria-label="LD Capital mark">
  <!-- Left leg: two parallel navy bars, apex → bottom-left -->
  <polygon points="42,6 49,6 20,66 13,66" fill="#122A4E"/>
  <polygon points="52,6 59,6 30,66 23,66" fill="#122A4E"/>
  <!-- Right leg: two parallel sky bars, apex → bottom-right -->
  <polygon points="49,6 56,6 84,66 77,66" fill="#7FB2DE"/>
  <polygon points="58,6 65,6 92,66 85,66" fill="#7FB2DE"/>
  <!-- Base: two horizontal navy bars anchoring the triangle -->
  <rect x="15" y="70" width="76" height="6" fill="#122A4E"/>
  <rect x="22" y="80" width="69" height="6" fill="#122A4E"/>
</svg>
